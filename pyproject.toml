[project]
name = "alphaforge"
version = "0.1.0"
description = "AlphaForge AI: a second-opinion engine for investment decisions (simulation only)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-aws>=0.2.10",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "yfinance>=0.2.40",
    "langgraph-checkpoint-aws>=1.2.7",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0",
    "certifi>=2024.2.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs AWS credentials / network; skipped unless --live is passed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Datathon2026", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
